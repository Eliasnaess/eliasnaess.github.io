mcq:
- id: q58
  w: 3
  src: Collier
  q: A causal-process observation (CPO) differs from a data-set observation in that it…
  o:
  - cannot be used for causal inference
  - provides information about context or mechanism, not necessarily as part of a systematic array
  - is a row in a rectangular data set
  - is always quantitative
  a: 1
  why: CPOs are diagnostic 'nuggets'; DSOs are the cases in a data matrix.
- id: q62
  w: 3
  src: Bateson
  q: Which comparison shows that a history of repression was NOT sufficient for electoral success?
  o:
  - Portillo vs Arzú
  - Ríos Montt vs Benedicto Lucas García
  - Ríos Montt in 1999 vs 2003
  - Ríos Montt vs Óscar Berger
  a: 1
  why: Lucas García, a notorious ex-military figure, won only a few thousand votes in 1990.
- id: q7
  w: 1
  src: Schwartz-Shea & Yanow
  q: Why did Zirakzadeh abandon his survey of Basque activists?
  o:
  - Too few activists agreed to participate
  - His supervisor required a quantitative design
  - Its questions bored respondents and did not match how they understood themselves and their politics
  - The Spanish authorities banned it
  a: 2
  why: He found ETA and Basque politics far more varied than the US literature suggested and wanted to capture participants' understandings, feelings and choices.
- id: q24
  w: 2
  src: Przeworski & Teune
  q: What is the main weakness of the most similar systems design, according to Przeworski & Teune?
  o:
  - It cannot be used with countries
  - It requires random sampling
  - It ignores the dependent variable
  - The differences that remain among similar systems are numerous enough to overdetermine the outcome
  a: 3
  why: Even similar countries differ in many ways, so the 'experimental' variable cannot be singled out; and social phenomena vary in syndromes.
- id: q4
  w: 1
  src: McCauley & Ruggeri
  q: '''Does X cause Y?'' and ''What is the effect of X on Y?'' differ in that the first asks about…'
  o:
  - description, the second about explanation
  - a monadic, the second about a dyadic relationship
  - a puzzle, the second about a gap
  - causes of effects, the second about effects of causes
  a: 3
  why: Question type 6 concerns causes of effects; type 7 effects of causes. The authors note the distinction is easy to state but hard to keep in practice.
- id: q23
  w: 2
  src: Przeworski & Teune
  q: The goal of comparative inquiry for Przeworski & Teune is to…
  o:
  - describe each country in its own terms
  - select countries at random
  - replace the proper names of social systems with variables
  - maximise the number of cases studied
  a: 2
  why: General theory consists of propositions 'devoid of the names of social systems'.
- id: q55
  w: 3
  src: Collier
  q: How is the 'doubly decisive' conclusion that the horse killed Straker reached?
  o:
  - By the auxiliary outcome alone
  - A single decisive clue
  - 'By combining tests: hoop tests eliminate Simpson and suicide, and several straws point to the horse — the method of elimination'
  - By statistical inference
  a: 2
  why: Doubly decisive tests are rare; they are usually built from several tests. Mill called the method of residues 'the most fertile in unexpected results'.
- id: q60
  w: 3
  src: Bateson
  q: Bateson's test of whether Ríos Montt had a 'special relationship' with the military is explicitly framed as a…
  o:
  - smoking-gun test
  - doubly decisive test
  - straw-in-the-wind
  - hoop test
  a: 3
  why: If military backing explained his success, he must at least have had close ties; he had many enemies in the army, so the hypothesis fails the hoop.
- id: q49
  w: 3
  src: Beach & Pedersen
  q: Which variant can NOT meaningfully be nested in a mixed-method design?
  o:
  - Explaining-outcome
  - Theory-testing
  - Theory-building
  - All three can
  a: 0
  why: Its case-specific, nonsystematic parts limit generalizability, so it cannot talk to other methods' theories.
- id: q52
  w: 3
  src: Collier
  q: Evidence that a hypothesis must pass to stay alive, but that does not confirm it, is a…
  o:
  - straw-in-the-wind
  - auxiliary outcome test
  - smoking-gun test
  - hoop test
  a: 3
  why: Hoop = necessary, not sufficient. Failing eliminates the hypothesis.
- id: q35
  w: 2
  src: Slater & Ziblatt
  q: Which is NOT one of Slater & Ziblatt's conditions for a controlled comparison to generate external validity?
  o:
  - Select cases that maximize control over alternative explanations
  - Seek representative variation
  - Confirm the result with a large-N regression
  - Craft arguments with general variables or mechanisms
  a: 2
  why: They argue large-N tests confirm external validity but do not produce it.
- id: q28
  w: 2
  src: Seawright & Gerring
  q: A researcher selects the country with the largest residual from a regression of democracy on GDP. Which technique is this?
  o:
  - Influential
  - Typical
  - Extreme
  - Deviant
  a: 3
  why: A deviant case is poorly explained by a cross-case model (high residual). An extreme case is far from the mean of a single variable.
- id: q27
  w: 2
  src: Przeworski & Teune
