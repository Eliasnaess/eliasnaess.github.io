plan:
- when: Saturday evening · 45 min
  do: Read the map below week by week. Tap every concept you can't define out loud. Then run Practice for Week 1.
- when: Sunday · 2 × 50 min
  do: Practice Weeks 2 and 3. Flashcards on everything you missed. Listen to the long Deep Dive on a walk. Write two short answers by hand and compare with the model answers.
- when: Sunday evening · 30 min
  do: Read the Traps list. Then one full Mock quiz (30 questions, 30 minutes). Re-read the map for every reading you scored below 80% on.
