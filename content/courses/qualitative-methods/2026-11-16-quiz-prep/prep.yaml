short:
- w: 1
  q: Explain the difference between induction and abduction, and use Zirakzadeh's Basque research to illustrate abduction.
  model: Induction moves from many particular observations to a general law. Abduction (Peirce) starts from a surprise — a clash between what the researcher expected and what she finds — and searches, back and forth between field and literature, for the conditions that would make it unsurprising; the explanation stays as situated as the puzzle. Zirakzadeh arrived with theory-derived expectations about modernization and a survey; the field surprised him (respondents were bored, ETA was more eclectic than the literature said), so he dropped the survey and theorised from participants' own understandings.
  check:
  - Induction defined (particular → general)
  - Abduction starts from a surprise or puzzle
  - Iterative, back-and-forth between field and theory
  - 'Zirakzadeh: expectation vs experience; survey jettisoned'
- w: 1
  q: Using two of Mahoney & Goertz's ten contrasts, explain why a qualitative researcher might reject a regression showing that wealth has a small average effect on democracy.
  model: 'First, the qualitative researcher asks causes-of-effects questions — why did this country democratize — while the regression gives an effects-of-causes answer, an average across cases. Second, qualitative causation is often set-theoretic: wealth might be part of an INUS combination or a necessary condition that an additive model blurs. Third (alternative), nonconforming cases matter: the qualitative researcher would want the cases off the regression line explained rather than consigned to the error term.'
  check:
  - Names two contrasts correctly
  - Causes-of-effects vs effects-of-causes
  - Necessary/sufficient or INUS vs additive
  - Applies them to the example
- w: 1
  q: Take the question 'Why did Norway not join the EU in 1994?' and move it up McCauley & Ruggeri's ladder of abstraction in three steps.
  model: '1) Replace specifics with categories: Why did a wealthy small state reject EU membership in the post-Cold War period? 2) Drop time and place: Why do wealthy small states reject regional integration? 3) Pose it positively and keep a scope condition: Under what conditions do wealthy small states join regional organizations? Each step trades case knowledge for generality; positive phrasing is clearer than explaining an absence.'
  check:
  - Specific → general categories
  - Drops temporal/geographic detail
  - Restates positively
  - Keeps a scope condition
- w: 1
  q: Define theory, hypothesis and causal mechanism as Martin does, with one example of each.
  model: 'Theory (Eckstein): a mental construct that orders phenomena or inquiry — e.g. power resources theory. Hypothesis: derived from theory, predicts a relationship between variables, operationalised and falsifiable — e.g. countries with higher unionization develop more generous unemployment benefits. Causal mechanism: an account of how a factor produces its effect — e.g. Thelen''s conversion, where factions capture vocational programmes and turn them to new purposes.'
  check:
  - Theory as ordering construct
  - 'Hypothesis: predicts, falsifiable'
  - 'Mechanism: how X produces Y'
  - An example for each
- w: 2
  q: A student wants to study why some post-communist parties survived. Explain how Slater & Ziblatt would want her to choose cases so the findings travel.
  model: 'She should (1) state the argument in general variables or mechanisms rather than proper names; (2) choose cases whose outcomes cover the population''s range — typological representativeness, e.g. regenerated, marginal and vanished parties — or run a brush-clearing large-N first if no typology exists; (3) select cases that let her control for rival explanations already in the literature (folk Bayesian: variation that existing hypotheses can''t explain). Out-of-sample cases, used after the argument is formed, then test its external validity.'
  check:
  - General variables
  - Representative variation / typological representativeness
  - Control of rival hypotheses
  - Out-of-sample cases for external validity
- w: 2
  q: Contrast Przeworski & Teune's most similar and most different systems designs. Which do they prefer and why?
  model: The most similar design picks systems sharing many traits, treats them as controlled, and explains outcomes by the remaining differences; but those differences are still many and overdetermine the outcome, and generalization is limited. The most different design starts from individuals in very different systems, assumes one homogeneous population and keeps the analysis at the individual level until systemic factors are needed — eliminating irrelevant systemic factors as it goes. They favour it because it aims at general statements free of proper names.
  check:
  - MSSD logic and weakness (overdetermination)
  - MDSD starts below the system level
  - Eliminates systemic factors step by step
  - Preference for MDSD and its reason
- w: 2
  q: 'You have a regression of civil-war onset on 150 countries. Name the Seawright & Gerring technique you would use for each goal: (a) see whether the mechanism actually operates; (b) find a missing explanation; (c) check whether one country is driving the result.'
  model: (a) A typical case — a low-residual on-lier where the model fits, to probe the mechanism. (b) A deviant case — a high-residual outlier the model explains poorly, to search for a new variable. (c) An influential case — one with high leverage or Cook's distance, to see if it drives the estimates.
  check:
  - Typical for mechanism
  - Deviant for new explanation
  - Influential for checking the model
  - Correct large-N tools named
- w: 2
  q: How does Grzymała-Busse's research design rule out piety and religious competition as explanations of church influence?
  model: She pairs countries that are matched on religiosity, regime type and development — Ireland–Italy, Poland–Croatia, US–Canada — yet differ in church influence, so piety cannot explain the difference. The religious-markets argument predicts more influence where competition is greater (Italy, Croatia), but these have less, so the evidence runs against it. What differs is the historical role of the church in defending the nation, which produced fusion and moral authority.
  check:
  - Most-similar pairs
  - Matched on religiosity etc.
  - Competition prediction contradicted
  - 'Alternative: fusion and moral authority'
- w: 3
  q: Explain Collier's four tests in terms of necessity and sufficiency, with a 'Silver Blaze' example for at least two.
  model: 'Straw-in-the-wind: neither necessary nor sufficient — adds or reduces plausibility (the dress bill hints at Straker''s motive). Hoop: necessary, not sufficient — failing eliminates (Straker''s shattered skull rules out suicide). Smoking gun: sufficient, not necessary — passing confirms (the curried mutton places the plot in Straker''s household). Doubly decisive: necessary and sufficient — confirms one hypothesis and eliminates the rest, usually built by combining tests (the horse).'
  check:
  - All four defined by necessity/sufficiency
  - Consequences of passing/failing
  - Correct examples
  - Doubly decisive usually built by combining
- w: 3
  q: Which of Beach & Pedersen's three variants fits Bateson's article, and which fits a study that explains 'the outbreak of the Rwandan genocide' as a whole? Justify.
  model: 'Bateson is closest to theory-testing: she takes existing explanations (successor party, civil-war successor, populism) and tests their predicted parts deductively in one case. A study explaining the whole Rwandan genocide is explaining-outcome process tracing: case-centric, seeking a minimally sufficient explanation that combines systematic and case-specific mechanisms. (Note that Bateson weighs several hypotheses against each other, which Beach & Pedersen say theory-testing alone rarely can.)'
  check:
  - Bateson ≈ deductive/theory-testing
  - Rwanda ≈ explaining-outcome
  - Theory- vs case-centric
  - Minimal sufficiency, nonsystematic parts
- w: 3
  q: Walk through how Bateson rules out military support as the reason for Ríos Montt's success.
  model: 'She sets up a hoop test: if military backing mattered, he must have had a special relationship with the army. He did not — he had many enemies, was dismissed in 1973, faced coup attempts, was tutored by businessmen in 1990 and wrote to officers asking for neutrality; civilian parties had equal or better military ties. She then looks for any assistance and finds none in the 1990s; 2003 help came through his son. Finally, sequence and timing show the civil patrols mobilised only in 2000–03, when paid, and then turned against him.'
  check:
  - Hoop test framing
  - Evidence of no special relationship
  - Comparison with civilian parties
  - 'Civil patrols: timing and sequence'
