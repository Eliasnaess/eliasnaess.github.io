traps:
- a: Extreme vs deviant case
  b: Extreme = far from the mean of ONE variable. Deviant = far from what a MODEL predicts.
- a: Deviant vs influential case
  b: Deviant = big residual (poorly explained). Influential = moves the estimates (leverage × residual); chosen to check the model, not to find new variables.
- a: Most similar systems design vs most similar cases
  b: Przeworski & Teune's MSSD is a system-level strategy they criticise; Seawright & Gerring's most-similar cases are a matched pair differing on X1. Both echo Mill's method of difference.
- a: Most different systems design vs Mill's method of agreement
  b: P&T's MDSD starts from individuals and eliminates systemic factors step by step; 'different cases, same X and Y' is Mill's agreement / S&G's most-different cases.
- a: Hoop vs smoking gun
  b: 'Hoop = necessary: failing kills. Smoking gun = sufficient: passing confirms. Ask: what happens if the hypothesis FAILS?'
- a: Straw-in-the-wind vs hoop
  b: A straw neither confirms nor eliminates. A hoop can eliminate.
- a: Induction vs abduction
  b: 'Induction: many particulars → general law. Abduction: a surprise → what would make it unsurprising (situated, iterative).'
- a: Theory-building vs explaining-outcome PT
  b: Theory-building wants a generalizable mechanism and makes no sufficiency claim. Explaining-outcome wants a minimally sufficient account of one case.
- a: Process tracing vs congruence
  b: Congruence checks whether X and Y line up as predicted; process tracing tests the parts of the mechanism between them.
- a: Causes-of-effects vs effects-of-causes
  b: '''Why did WWI happen?'' vs ''What is the average effect of democracy on war?'''
- a: Internal vs external validity
  b: 'Internal = holds for the cases studied. External = holds out of sample. Slater & Ziblatt: controlled comparisons can do both; large-N confirms external validity, it doesn''t create it.'
- a: INUS — whose and what
  b: Mahoney & Goertz (from Mackie). Insufficient but Non-redundant part of an Unnecessary but Sufficient combination.
- a: Concept formation vs concept development
  b: 'Formation: a priori, operationalised (positivist). Development: from actors'' own usage in context (interpretive).'
- a: Selecting on the dependent variable
  b: 'Mahoney & Goertz: fine for necessary-condition claims. Seawright & Gerring: extreme cases are fine if background cases stay in view.'
- a: Bateson's tests
  b: Only the military hypothesis gets an explicit hoop test; the civil patrols are judged by sequence and timing.
- a: Puzzle vs question
  b: Every puzzle is a question, not every question is a puzzle (Zinnes). Puzzle = 'Why x despite y?'
